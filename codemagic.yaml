workflows:
  tpms-android-apk:
    name: TPMS Android APK (Supabase)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        SUPABASE_URL: https://drgttmvxxhltlkeyoizy.supabase.co
      groups:
        - tpms_keys
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build debug APK with Supabase flags
        script: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - zeeshan@example.com
